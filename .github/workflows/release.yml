name: Release

# Push a tag vX.Y.Z on main to build, test, pack with Velopack and publish to GitHub Releases.
# Installed apps pick the new release up automatically. Release notes come from the matching
# "## X.Y.Z" section of src/StockHelper.App/Resources/Changelog.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag must be vX.Y.Z, got '${{ github.ref_name }}'" }
          "value=$version" >> $env:GITHUB_OUTPUT

      # Releases are cut from main only; dev is for work in progress.
      - name: Check tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag ${{ github.ref_name }} is not on main" }

      - name: Release notes from changelog
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $lines = Get-Content src/StockHelper.App/Resources/Changelog.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## +$([regex]::Escape($version))(\s|$)" })
          if ($start -lt 0) { throw "Changelog.md has no '## $version' section" }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
          if ($end -lt 0) { $end = $lines.Length }
          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $footer = @(
            '', '---', '',
            '**Установка:** скачайте и запустите `StockHelper-win.msi` — мастер покажет лицензионное соглашение и предложит установить программу для текущего пользователя или для всех пользователей компьютера. Установленные программы обновятся сами.',
            '',
            '**Документация:** [общая](https://github.com/${{ github.repository }}/blob/main/docs/general.md) · [кладовщик](https://github.com/${{ github.repository }}/blob/main/docs/storekeeper.md) · [руководитель](https://github.com/${{ github.repository }}/blob/main/docs/manager.md) · [администратор](https://github.com/${{ github.repository }}/blob/main/docs/administrator.md)'
          ) -join "`n"
          Set-Content release-notes.md ($notes.Trim() + "`n" + $footer) -Encoding utf8

      - name: Restore tools
        run: dotnet tool restore

      - name: Test
        run: dotnet test StockHelper.sln -c Release

      - name: Publish
        run: >
          dotnet publish src/StockHelper.App/StockHelper.App.csproj
          -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      # Previous release is needed to build delta packages (small updates).
      - name: Download previous release
        continue-on-error: true
        run: >
          dotnet vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o releases

      # Code signing: set the SIGN_PARAMS secret (signtool arguments, e.g. "/a /fd sha256 /tr http://timestamp.digicert.com /td sha256")
      # or switch to --azureTrustedSignFile. Without the secret the package is built unsigned.
      - name: Pack
        shell: pwsh
        env:
          SIGN_PARAMS: ${{ secrets.SIGN_PARAMS }}
        run: |
          $sign = @()
          if ($env:SIGN_PARAMS) { $sign = @('--signParams', $env:SIGN_PARAMS) }
          dotnet vpk pack `
            --packId StockHelper `
            --packVersion ${{ steps.version.outputs.value }} `
            --packDir publish `
            --mainExe StockHelper.exe `
            --packTitle StockHelper `
            --packAuthors "Aleksandr Ogienko" `
            --icon src/StockHelper.App/Assets/app.ico `
            --msi `
            --instLicense LICENSE.md `
            --instLocation Either `
            --msiDialogBackground installer/dialog.bmp `
            --msiTopBanner installer/banner.bmp `
            --releaseNotes release-notes.md `
            -o releases `
            @sign

      - name: Upload to GitHub Releases
        run: >
          dotnet vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "StockHelper ${{ steps.version.outputs.value }}"
          --tag ${{ github.ref_name }}
          -o releases

      - name: Release description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --notes-file release-notes.md

      # Only the MSI is offered for download: it shows the license agreement before installing.
      # Updates use releases.win.json and the .nupkg packages, which stay.
      - name: Keep the MSI as the only installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          foreach ($asset in 'StockHelper-win-Setup.exe', 'StockHelper-win-Portable.zip') {
            gh release delete-asset ${{ github.ref_name }} $asset --yes 2>$null
            $global:LASTEXITCODE = 0
          }
